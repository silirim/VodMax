plugins {
    id "com.android.application"
}

// Release signing: a keystore.properties (storeFile, storePassword,
// keyAlias, keyPassword) outside the repository, by default in
// ~/.config/vodmax-release, or where VODMAX_SIGNING points. Updates must
// always be signed with the same key, or Android refuses them.
def signingFile = file(System.getenv("VODMAX_SIGNING") ?: "${System.getProperty("user.home")}/.config/vodmax-release/keystore.properties")
def signing = new Properties()
if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

android {
    namespace "app.vodmax.client"
    compileSdk 35

    defaultConfig {
        applicationId "app.vodmax.client"
        minSdk 24
        targetSdk 35
        versionCode 19
        versionName "0.6.0-beta.7"
    }

    buildFeatures { buildConfig true }

    // The built-in server (build-server.sh) is installed as a file, so
    // that it can run.
    packaging {
        jniLibs { useLegacyPackaging true }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (signingFile.exists()) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    def media3 = "1.9.3"
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    implementation "androidx.core:core:1.13.1" // FileProvider, for updates
}
