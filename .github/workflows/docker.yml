name: docker

# The server image ghcr.io/silirim/vodmax, for amd64, arm64 and armv7,
# published with each release (tag v*) or by hand with a version. Only a
# tag moves "latest", which Compose and Unraid users pull automatically.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g. 0.5.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - name: Version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          [ -n "$v" ] || v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # ci.yml runs on the same tag but in parallel, and a workflow cannot
      # wait for another one's job: the image is built only after the same
      # checks pass here.
      - name: Test
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -race -count=1 ./...
      - name: Build the server
        run: |
          for t in amd64: arm64: arm:7; do
            arch=${t%%:*}; arm=${t#*:}; dir=build/linux_$arch; [ -n "$arm" ] && dir=build/linux_${arch}v$arm
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch GOARM=$arm go build -trimpath \
              -ldflags="-s -w -X main.version=${{ steps.v.outputs.version }}" -o $dir/vodmax-server ./cmd/vodmax-server
          done
          cp packaging/docker-entrypoint.sh build/
          ls -R build
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/silirim/vodmax
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.v.outputs.version }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && !contains(steps.v.outputs.version, '-') }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
