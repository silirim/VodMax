name: Idea / Proposta
description: Something VodMax could do. / Qualcosa che VodMax potrebbe fare.
labels: [idea]
body:
  - type: markdown
    attributes:
      value: |
        Choices already made are in the [decision records](https://github.com/silirim/VodMax/blob/main/docs/decisioni/README.md) (Italian): have a look first.
        Le scelte già fatte sono nelle [schede di decisione](https://github.com/silirim/VodMax/blob/main/docs/decisioni/README.md): dai prima un'occhiata.
  - type: textarea
    id: need
    attributes:
      label: What you need / Di cosa hai bisogno
      description: The situation, not the solution first. / La situazione, prima della soluzione.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work / Come potrebbe funzionare
