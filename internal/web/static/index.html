<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<script src="look.js"></script>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="vod.css">
</head>
<body>
<header class="top">
  <nav id="tabs">
    <button class="tab focusable" data-view="home" data-icon="house">Home</button>
    <button class="tab focusable" data-view="movie" data-icon="film" data-i18n>Film</button>
    <button class="tab focusable" data-view="series" data-icon="clapperboard" data-i18n>Serie</button>
    <button class="tab focusable" data-view="mylist" data-icon="bookmark" data-i18n>La mia lista</button>
    <button class="tab focusable compact" data-view="recordings" data-icon="video" title="Registrazioni" data-i18n data-i18n-attr="title"><span class="tab-text">Registrazioni</span></button>
    <button class="tab focusable compact" data-view="downloads" data-icon="download" title="Download" data-i18n data-i18n-attr="title" hidden><span class="tab-text">Download</span></button>
    <button class="tab focusable" data-view="tv" data-icon="tv">TV</button>
    <a class="tab focusable compact" href="/guide.html" data-icon="calendar-days" title="Guida" data-i18n data-i18n-attr="title"><span class="tab-text">Guida</span></a>
    <a class="tab focusable icon-only" href="/settings.html" data-icon="settings" title="Impostazioni" aria-label="Impostazioni" data-i18n data-i18n-attr="title,aria-label"><span class="tab-text">Impostazioni</span></a>
  </nav>
  <input id="search" class="focusable" type="search" placeholder="Cerca film e serie" autocomplete="off" aria-label="Cerca" data-i18n-attr="placeholder,aria-label">
</header>

<main id="content" aria-live="polite"></main>

<section id="detail" class="detail" hidden>
  <div id="detail-art" class="detail-art"></div>
  <button id="detail-back" class="button back-button focusable" type="button" data-icon="arrow-left" data-i18n>Indietro</button>
  <div class="detail-head">
    <img id="detail-image" alt="" hidden>
    <div>
      <h1 id="detail-title"></h1>
      <div id="detail-meta" class="meta"></div>
      <p id="detail-plot" class="plot"></p>
      <div id="detail-actions" class="actions"></div>
      <dl id="detail-credits" class="credits"></dl>
    </div>
  </div>
  <section id="cast" class="cast" hidden>
    <h2 class="section" data-i18n>Cast</h2>
    <ul id="cast-list" class="cast-list"></ul>
  </section>
  <nav id="seasons" class="seasons chips"></nav>
  <ol id="episodes" class="episodes"></ol>
  <section id="similar" hidden>
    <h2 class="section" data-i18n>Titoli simili</h2>
    <div id="similar-row" class="row"></div>
  </section>
</section>

<section id="player" class="player" hidden>
  <video id="video" playsinline></video>
  <div id="player-extra" class="player-extra">
    <button id="skip-intro" class="button focusable" data-icon="skip-forward" hidden data-i18n>Salta intro</button>
    <button id="skip-ad" class="button focusable" data-icon="skip-forward" hidden data-i18n>Salta pubblicità</button>
    <div id="next-card" class="next-card glass-dark" hidden>
      <span class="next-label" data-i18n>Prossimo episodio</span>
      <strong id="next-title"></strong>
      <span id="next-count" class="next-count tnum"></span>
      <div class="next-buttons">
        <button id="next-now" class="button primary focusable" data-icon="play" data-i18n>Guarda ora</button>
        <button id="next-cancel" class="button focusable" data-i18n>Annulla</button>
      </div>
    </div>
  </div>
  <div id="player-bar" class="player-bar glass-dark">
    <div id="player-title" class="player-title"></div>
    <div class="player-line">
      <span id="player-pos" class="tnum">0:00</span>
      <div id="player-seek" class="player-seek" role="slider" aria-label="Posizione" tabindex="-1" data-i18n-attr="aria-label">
        <div class="player-progress"><div id="player-fill"></div></div>
        <span id="player-hover" class="player-hover tnum" hidden></span>
      </div>
      <span id="player-dur" class="tnum"></span>
    </div>
    <div class="player-buttons">
      <button class="button focusable" data-action="close" data-icon="x" data-i18n>Chiudi</button>
      <button class="button focusable" data-action="back10" data-icon="rotate-ccw">10 s</button>
      <button class="button focusable" data-action="toggle" data-icon="pause" id="player-toggle" data-i18n>Pausa</button>
      <button class="button focusable" data-action="fwd30" data-icon="rotate-cw">30 s</button>
      <button class="button focusable" data-action="live" data-icon="skip-forward" id="player-live" hidden data-i18n>Torna in diretta</button>
      <button class="button focusable" data-action="audio" data-icon="volume-2" id="player-audio" hidden>Audio</button>
      <button class="button focusable" data-action="subs" data-icon="captions" id="player-subs" hidden data-i18n>Sottotitoli</button>
      <button class="button focusable" data-action="next" data-icon="skip-forward" id="player-next" hidden data-i18n>Prossimo episodio</button>
      <button class="button focusable" data-action="fullscreen" data-icon="maximize" id="player-full" hidden data-i18n data-i18n-attr="aria-label" aria-label="Schermo intero"><span class="lbl">Schermo intero</span></button>
    </div>
    <div id="player-menu" class="player-menu" hidden></div>
  </div>
</section>

<div id="status" class="status" hidden></div>
<script src="vendor/mpegts-1.8.2.min.js"></script>
<script src="i18n/languages.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="vod.js"></script>
</body>
</html>
