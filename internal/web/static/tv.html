<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax · TV</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin>
<script src="look.js"></script>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="guide.css">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<main id="screen">
  <video id="video" autoplay playsinline></video>

  <section id="banner" class="banner glass-dark" hidden aria-live="polite">
    <span id="banner-number" class="number tnum"></span>
    <span id="banner-logo" class="logo"></span>
    <div class="info">
      <div class="head"><span id="banner-name" class="name"></span><span id="banner-quality" class="badge hd"></span></div>
      <div id="banner-now" class="title"></div>
      <div id="banner-now-time" class="time tnum"></div>
      <div class="progress-row tnum"><span id="banner-start"></span><div class="progress"><div id="banner-progress"></div></div><span id="banner-stop"></span></div>
      <div id="banner-next-row" class="next"><span data-i18n>A seguire</span> · <b id="banner-next"></b> · <span id="banner-next-time" class="tnum"></span></div>
      <div id="banner-hint" class="hint"></div>
    </div>
    <div class="side">
      <span id="banner-badges" class="badges"></span>
      <span id="banner-mode" class="badge mode"></span>
    </div>
  </section>

  <section id="controls" class="controls glass-dark" hidden>
    <div class="ctl-group">
      <button class="tab" data-action="menu" data-i18n data-i18n-attr="title" data-icon="house" title="Torna al menu (Indietro)">Menu</button>
      <button class="tab" data-action="list" data-i18n data-i18n-attr="title" data-icon="list" title="Elenco dei canali (OK)">Canali</button>
      <button class="tab" data-action="guide" data-i18n data-i18n-attr="title" data-icon="calendar-days" title="Guida TV (Guida / E)">Guida</button>
    </div>
    <div class="ctl-group">
      <button class="tab" data-action="startOver" data-i18n-attr="title" data-icon="undo-2" title="Dall'inizio del programma"><span class="txt" data-i18n>Dall'inizio</span></button>
      <button class="tab" data-action="back10" data-i18n data-i18n-attr="title" data-icon="rotate-ccw" title="Indietro di 10 secondi (◀)">10 s</button>
      <button class="tab" data-action="toggle" data-i18n data-i18n-attr="title" data-icon="pause" id="ctl-toggle" title="Pausa / riprendi (Spazio)">Pausa</button>
      <button class="tab" data-action="fwd30" data-i18n data-i18n-attr="title" data-icon="rotate-cw" title="Avanti di 30 secondi (▶)">30 s</button>
      <button class="tab" data-action="live" data-i18n data-i18n-attr="title" data-icon="radio" id="ctl-live" title="Torna al punto in diretta">In diretta</button>
    </div>
    <div class="ctl-group">
      <button class="tab" data-action="fav" data-i18n data-i18n-attr="title" data-icon="star" id="ctl-fav" title="Preferito (Giallo / F)">Preferito</button>
      <button class="tab" data-action="rec" data-i18n-attr="title" data-icon="circle-dot" title="Registra il programma in onda (Blu / R)"><span class="txt" data-i18n>Registra</span></button>
      <button class="tab" data-action="multiview" data-i18n data-i18n-attr="title" data-icon="layout-grid" title="Più canali insieme"><span class="txt">Multiview</span></button>
      <button class="tab" data-action="fullscreen" data-i18n data-i18n-attr="title" data-icon="maximize" id="ctl-full" title="Schermo intero" hidden><span class="txt" data-i18n>Schermo intero</span></button>
    </div>
  </section>

  <section id="timeline" class="timeline glass-dark" hidden>
    <div class="tl-head"><span id="tl-title" class="tl-title"></span><span id="tl-state" class="tl-state tnum"></span></div>
    <div id="tl-bar" class="tl-bar" role="slider" aria-label="Posizione nel programma" data-i18n-attr="aria-label">
      <div class="tl-track"><div id="tl-aired"></div><div id="tl-buffer"></div><div id="tl-fill"></div><div id="tl-pos"></div></div>
      <span id="tl-hover" class="tl-hover tnum" hidden></span>
    </div>
    <div class="tl-times tnum"><span id="tl-start"></span><span id="tl-end"></span></div>
  </section>

  <section id="list" class="list glass-dark" hidden>
    <h2 class="list-title" data-i18n>Canali</h2>
    <label class="list-find" data-icon="search"><input id="list-search" type="search" placeholder="Cerca un canale" aria-label="Cerca un canale" data-i18n-attr="placeholder,aria-label" enterkeyhint="search" autocomplete="off" spellcheck="false"></label>
    <nav id="list-tabs" class="tabs"></nav>
    <ol id="list-items"></ol>
    <p class="hint" data-i18n>OK guarda · ◀ ▶ cambia elenco · Giallo preferito · Blu registra · Indietro chiude</p>
  </section>

  <!-- The guide over the video (decision 0053): the picture keeps playing
       in a window at the top right, the grid of guide-grid.js below. -->
  <section id="guide-overlay" class="guide-overlay" hidden>
    <div class="guide-top">
      <nav id="guide-bar" class="guide-bar">
        <button class="tab focusable" data-list="all" data-i18n>Tutti</button>
        <button class="tab focusable" data-list="favorites" data-i18n>Preferiti</button>
        <button class="tab focusable" data-list="sport" data-i18n>Sport</button>
        <span class="guide-nav" data-i18n>
          <button class="tab focusable" data-move="yesterday">Ieri sera</button>
          <button class="tab focusable" data-move="-2">◀ 2 ore</button>
          <span class="guide-when"></span>
          <button class="tab focusable" data-move="2">2 ore ▶</button>
          <button class="tab focusable" data-move="now">Adesso</button>
          <button class="tab focusable" data-move="day">Domani sera</button>
        </span>
      </nav>
      <section id="guide-panel" class="programme-panel" hidden></section>
    </div>
    <div id="guide-grid" class="guide"></div>
  </section>

  <div id="digits" class="digits glass-dark tnum" hidden></div>
  <div id="status" class="status" hidden></div>
  <section id="dialog" class="panel dialog" hidden>
    <p id="dialog-text"></p>
    <div class="dialog-buttons">
      <button id="dialog-yes" type="button" data-i18n>Sì</button>
      <button id="dialog-no" type="button" data-i18n>Annulla</button>
    </div>
    <p class="hint" data-i18n>OK per confermare · Indietro per annullare</p>
  </section>
</main>
<script src="vendor/mpegts-1.8.2.min.js"></script>
<script src="vendor/hls-1.7.3.min.js"></script>
<script src="i18n/languages.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="guide-grid.js"></script>
<script src="tv.js"></script>
</body>
</html>
