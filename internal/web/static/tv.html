<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VodMax · TV</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="tv.css">
</head>
<body>
<main id="screen">
  <video id="video" autoplay playsinline></video>

  <section id="banner" class="banner" hidden aria-live="polite">
    <div class="banner-head">
      <span id="banner-number" class="number"></span>
      <img id="banner-logo" class="logo" alt="" hidden>
      <span id="banner-name" class="name"></span>
      <span id="banner-badges" class="badges"></span>
      <span id="banner-mode" class="mode"></span>
    </div>
    <div class="programme">
      <span class="label" data-i18n>Ora</span>
      <span id="banner-now" class="title"></span>
      <span id="banner-now-time" class="time"></span>
    </div>
    <div class="progress"><div id="banner-progress"></div></div>
    <div class="programme next">
      <span class="label" data-i18n>A seguire</span>
      <span id="banner-next" class="title"></span>
      <span id="banner-next-time" class="time"></span>
    </div>
    <div id="banner-hint" class="hint"></div>
  </section>

  <section id="controls" class="controls" hidden>
    <button data-action="menu" data-i18n data-i18n-attr="title" data-icon="house" title="Torna al menu (Indietro)">Menu</button>
    <button data-action="list" data-i18n data-i18n-attr="title" data-icon="list" title="Elenco dei canali (OK)">Canali</button>
    <button data-action="startOver" data-i18n data-i18n-attr="title" data-icon="undo-2" title="Dall'inizio del programma">Dall'inizio</button>
    <button data-action="back10" data-i18n data-i18n-attr="title" data-icon="rotate-ccw" title="Indietro di 10 secondi (◀)">10 s</button>
    <button data-action="toggle" data-i18n data-i18n-attr="title" data-icon="pause" id="ctl-toggle" title="Pausa / riprendi (Spazio)">Pausa</button>
    <button data-action="fwd30" data-i18n data-i18n-attr="title" data-icon="rotate-cw" title="Avanti di 30 secondi (▶)">30 s</button>
    <button data-action="live" data-i18n data-i18n-attr="title" data-icon="radio" id="ctl-live" title="Torna al punto in diretta">In diretta</button>
    <button data-action="fav" data-i18n data-i18n-attr="title" data-icon="star" id="ctl-fav" title="Preferito (Giallo / F)">Preferito</button>
    <button data-action="rec" data-i18n data-i18n-attr="title" data-icon="circle-dot" title="Registra il programma in onda (Blu / R)">Registra</button>
    <button data-action="multiview" data-i18n data-i18n-attr="title" data-icon="layout-grid" title="Più canali insieme" class="icon-only"><span class="txt">Multiview</span></button>
  </section>

  <section id="timeline" class="timeline" hidden>
    <div class="tl-head"><span id="tl-title" class="tl-title"></span><span id="tl-state" class="tl-state"></span></div>
    <div id="tl-bar" class="tl-bar" role="slider" aria-label="Posizione nel programma" data-i18n-attr="aria-label">
      <div class="tl-track"><div id="tl-aired"></div><div id="tl-buffer"></div><div id="tl-fill"></div><div id="tl-pos"></div></div>
      <span id="tl-hover" class="tl-hover" hidden></span>
    </div>
    <div class="tl-times"><span id="tl-start"></span><span id="tl-end"></span></div>
  </section>

  <section id="list" class="list" hidden>
    <nav id="list-tabs" class="tabs"></nav>
    <ol id="list-items"></ol>
    <p class="hint" data-i18n>OK guarda · ◀ ▶ cambia elenco · Giallo preferito · Blu registra · Indietro chiude</p>
  </section>

  <div id="digits" class="digits" hidden></div>
  <div id="status" class="status" hidden></div>
  <section id="dialog" class="panel dialog" hidden>
    <p id="dialog-text"></p>
    <div class="dialog-buttons">
      <button id="dialog-yes" type="button" data-i18n>Sì</button>
      <button id="dialog-no" type="button" data-i18n>Annulla</button>
    </div>
    <p class="hint" data-i18n>OK per confermare · Indietro per annullare</p>
  </section>
</main>
<script src="vendor/mpegts-1.8.2.min.js"></script>
<script src="vendor/hls-1.7.3.min.js"></script>
<script src="i18n/languages.js"></script>
<script src="i18n.js"></script>
<script src="icons.js"></script>
<script src="common.js"></script>
<script src="tv.js"></script>
</body>
</html>
